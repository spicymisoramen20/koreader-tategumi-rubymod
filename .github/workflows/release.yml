name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2025.05)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MAKEFLAGS: "PARALLEL_JOBS=3 OUTPUT_DIR=build"
  OTA_BASE_URL: "https://github.com/${{ github.repository }}/releases/latest/download"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:

  kindle:
    name: Kindle
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindle
      - name: Package
        run: make TARGET=kindle update
      - name: Rename for release
        run: |
          cp koreader-kindle-*.zip koreader-kindle-latest-stable.zip || true
          cp koreader-kindle-*.targz koreader-kindle-latest-stable.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: kindle
          path: |
            koreader-kindle-latest-stable.zip
            koreader-kindle-latest-stable.targz

  kindlehf:
    name: Kindle (HF)
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindlehf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindlehf
      - name: Package
        run: make TARGET=kindlehf update
      - name: Rename for release
        run: |
          cp koreader-kindlehf-*.zip koreader-kindlehf-latest-stable.zip || true
          cp koreader-kindlehf-*.targz koreader-kindlehf-latest-stable.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: kindlehf
          path: |
            koreader-kindlehf-latest-stable.zip
            koreader-kindlehf-latest-stable.targz

  kindlepw2:
    name: Kindle (PW2/non-HF)
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindlepw2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindlepw2
      - name: Package
        run: make TARGET=kindlepw2 update
      - name: Rename for release
        run: |
          cp koreader-kindlepw2-*.zip koreader-kindlepw2-latest-stable.zip || true
          cp koreader-kindlepw2-*.targz koreader-kindlepw2-latest-stable.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: kindlepw2
          path: |
            koreader-kindlepw2-latest-stable.zip
            koreader-kindlepw2-latest-stable.targz

  kobo:
    name: Kobo
    runs-on: ubuntu-latest
    container:
      image: koreader/kokobo:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kobo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kobo
      - name: Package
        run: make TARGET=kobo update
      - name: Rename for release
        run: |
          cp koreader-kobo-*.zip koreader-kobo-latest-stable.zip || true
          cp koreader-kobo-*.targz koreader-kobo-latest-stable.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: kobo
          path: |
            koreader-kobo-latest-stable.zip
            koreader-kobo-latest-stable.targz

  pocketbook:
    name: PocketBook
    runs-on: ubuntu-latest
    container:
      image: koreader/kopb:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: pocketbook
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=pocketbook
      - name: Package
        run: make TARGET=pocketbook update
      - name: Rename for release
        run: |
          cp koreader-pocketbook-*.zip koreader-pocketbook-latest-stable.zip || true
          cp koreader-pocketbook-*.targz koreader-pocketbook-latest-stable.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbook
          path: |
            koreader-pocketbook-latest-stable.zip
            koreader-pocketbook-latest-stable.targz

  cervantes:
    name: Cervantes
    runs-on: ubuntu-latest
    container:
      image: koreader/kocervantes:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: cervantes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=cervantes
      - name: Package
        run: make TARGET=cervantes update
      - name: Rename for release
        run: |
          cp koreader-cervantes-*.zip koreader-cervantes-latest-stable.zip || true
          cp koreader-cervantes-*.targz koreader-cervantes-latest-stable.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: cervantes
          path: |
            koreader-cervantes-latest-stable.zip
            koreader-cervantes-latest-stable.targz

  remarkable:
    name: reMarkable (armhf)
    runs-on: ubuntu-latest
    container:
      image: koreader/koremarkable:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: remarkable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=remarkable
      - name: Package
        run: make TARGET=remarkable update
      - name: Rename for release
        run: |
          cp koreader-remarkable-*.zip koreader-remarkable-latest-stable.zip || true
          cp koreader-remarkable-*.targz koreader-remarkable-latest-stable.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: remarkable
          path: |
            koreader-remarkable-latest-stable.zip
            koreader-remarkable-latest-stable.targz

  remarkable-aarch64:
    name: reMarkable (aarch64)
    runs-on: ubuntu-latest
    container:
      image: koreader/koremarkable:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: remarkable-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=remarkable-aarch64
      - name: Package
        run: make TARGET=remarkable-aarch64 update
      - name: Rename for release
        run: |
          cp koreader-remarkable-aarch64-*.zip koreader-remarkable-aarch64-latest-stable.zip || true
          cp koreader-remarkable-aarch64-*.targz koreader-remarkable-aarch64-latest-stable.targz || true
      - uses: actions/upload-artifact@v4
        with:
          name: remarkable-aarch64
          path: |
            koreader-remarkable-aarch64-latest-stable.zip
            koreader-remarkable-aarch64-latest-stable.targz

  android-arm:
    name: Android (ARM)
    runs-on: ubuntu-latest
    container:
      image: koreader/koandroid:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
      ANDROID_ARCH: arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=android
      - name: Package
        run: make TARGET=android update
      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            koreader-android-*.apk
          rm -f /tmp/release.keystore
      - name: Rename for release
        run: cp koreader-android-*.apk koreader-android-latest-stable.apk 2>/dev/null || \
             cp koreader-android-*.zip koreader-android-latest-stable.zip 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm
          path: koreader-android-latest-stable.*

  android-arm64:
    name: Android (ARM64)
    runs-on: ubuntu-latest
    container:
      image: koreader/koandroid:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
      ANDROID_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=android ANDROID_ARCH=arm64
      - name: Package
        run: make TARGET=android ANDROID_ARCH=arm64 update
      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            koreader-android-*.apk
          rm -f /tmp/release.keystore
      - name: Rename for release
        run: cp koreader-android-arm64-*.apk koreader-android-arm64-latest-stable.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: koreader-android-arm64-latest-stable.apk

  macos:
    name: macOS (${{ matrix.arch_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: '15'
            platform: 'x86-64'
            arch_label: x86_64
            xcode_version: '16.4'
            deployment_target: '10.15'
            jobs: 5
          - image: '15'
            platform: 'ARM64'
            arch_label: arm64
            xcode_version: '16.4'
            deployment_target: '11.0'
            jobs: 4
    runs-on: "macos-${{ matrix.image }}${{ matrix.platform == 'x86-64' && '-intel' || '' }}"
    env:
      CLICOLOR_FORCE: '1'
      KODEBUG: ""
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      MAKEFLAGS: OUTPUT_DIR=build PARALLEL_JOBS=${{ matrix.jobs }} INSTALL_DIR=install TARGET=macos
    steps:
      - name: XCode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode_version }}.app
          xcodebuild -version
          xcode-select -p

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -x
          python3 -m pip install --disable-pip-version-check meson ruamel.yaml
          wget -O ninjatracing.zip https://github.com/cradleapps/ninjatracing/archive/084212eaf68f25c70579958a2ed67fb4ec2a9ca4.zip
          unzip -j ninjatracing.zip '*/ninjatracing'
          install -m755 ninjatracing /usr/local/bin/
          rm ninjatracing*
          packages=(
            autoconf
            automake
            bash
            binutils
            coreutils
            findutils
            libtool
            make
            nasm
            ninja
            pkg-config
            util-linux
          )
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_UPGRADE=1
          brew uninstall gradle maven || true
          brew install --formula --overwrite --quiet "${packages[@]}"

      - name: Update PATH
        run: >
          printf '%s\n'
          "$(brew --prefix)/opt/findutils/libexec/gnubin"
          "$(brew --prefix)/opt/make/libexec/gnubin"
          "$(brew --prefix)/opt/util-linux/bin"
          | tee "${GITHUB_PATH}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Fetch submodules
        run: make fetchthirdparty

      - name: Build
        run: make base

      - name: Checking binaries for missing dependencies
        run: make bincheck

      - name: Package
        run: make skeleton update --assume-old=base

      - name: Rename for release
        run: |
          shopt -s nullglob
          files=(koreader-macos-*.7z)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "ERROR: no macOS .7z package found"
            ls -la
            exit 1
          fi
          cp "${files[0]}" "koreader-macos-${{ matrix.arch_label }}-latest-stable.7z"
          ls -lh "koreader-macos-${{ matrix.arch_label }}-latest-stable.7z"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch_label }}
          path: koreader-macos-${{ matrix.arch_label }}-latest-stable.7z

  win32:
    name: Windows (x86_64)
    runs-on: ubuntu-latest
    container:
      image: koreader/koappimage:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: win32
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the workflow ref (branch tip or tag SHA), not RELEASE_TAG alone.
          # Tag v2026.08.12 predates make/win32.mk and the MinGW ldflags fix;
          # dispatching from feature/ruby-toggle must build that tip.
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install MinGW toolchain
        run: |
          set -eux
          # koappimage is Debian/Ubuntu based; mingw-w64 provides
          # x86_64-w64-mingw32-gcc used by TARGET=win32.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            p7zip-full

      - name: Fetch submodules
        run: make fetchthirdparty

      - name: Build
        run: make TARGET=win32

      - name: Package
        run: make TARGET=win32 update

      - name: Rename for release
        run: |
          shopt -s nullglob
          files=(koreader-win32-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "ERROR: no win32 zip package found"
            ls -la
            exit 1
          fi
          cp "${files[0]}" koreader-win32-latest-stable.zip
          ls -lh koreader-win32-latest-stable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win32
          path: koreader-win32-latest-stable.zip

  release:
    name: Create Release
    needs: [kindle, kindlehf, kindlepw2, kobo, pocketbook, cervantes, remarkable, remarkable-aarch64, android-arm, android-arm64, macos, win32]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create OTA aliases and versioned copies
        run: |
          TAG=$RELEASE_TAG
          # kobov5: same binary as kobo (FW 5.x uses different ota_model string)
          cp artifacts/kobo/koreader-kobo-latest-stable.zip \
             artifacts/kobo/koreader-kobov5-latest-stable.zip
          cp artifacts/kobo/koreader-kobo-latest-stable.targz \
             artifacts/kobo/koreader-kobov5-latest-stable.targz
          # kindle-legacy: same binary as kindle (non-touch Kindles)
          cp artifacts/kindle/koreader-kindle-latest-stable.zip \
             artifacts/kindle/koreader-kindle-legacy-latest-stable.zip
          cp artifacts/kindle/koreader-kindle-latest-stable.targz \
             artifacts/kindle/koreader-kindle-legacy-latest-stable.targz
          # Versioned copies of all zips and targz files
          for f in artifacts/**/*-latest-stable.zip artifacts/**/*-latest-stable.targz; do
            cp "$f" "${f/latest-stable/$TAG}"
          done
          # Versioned copies of APKs
          for f in artifacts/**/*-latest-stable.apk; do
            cp "$f" "${f/latest-stable/$TAG}" 2>/dev/null || true
          done
          # Versioned copies of macOS 7z packages
          for f in artifacts/**/*-latest-stable.7z; do
            cp "$f" "${f/latest-stable/$TAG}" 2>/dev/null || true
          done
          # Android "link" type OTA index files (no extension, first line = APK filename)
          # otamanager downloads koreader-android[-arm64]-latest-stable (no ext),
          # reads line 1 as the APK filename, then downloads that APK directly.
          echo "koreader-android-arm64-$TAG.apk" \
            > artifacts/android-arm64/koreader-android-arm64-latest-stable
          echo "koreader-android-$TAG.apk" \
            > artifacts/android-arm/koreader-android-latest-stable

      - name: Generate zsync files
        run: |
          # OTA packages are .targz (gzipped tar), not .zip.
          # koreader.sh applies the update with: tar -xf koreader.updated.tar
          # GNU tar auto-detects gzip, so .targz works fine.
          # zsyncmake input = versioned .targz → Filename header = versioned name
          # OTA manager reads Filename to extract version (v2026.05 pattern).
          # zsync2 downloads: getOTAServer() + Filename = releases/.../koreader-X-v2026.05.targz
          sudo apt-get update -qq && sudo apt-get install -y zsync
          TAG=$RELEASE_TAG
          shopt -s globstar
          for f in artifacts/**/*-"$TAG".targz; do
            name=$(basename "$f")
            stable_name="${name/$TAG/latest-stable}"
            dir=$(dirname "$f")
            zsyncmake -u "$OTA_BASE_URL/$stable_name" \
              -o "$dir/${stable_name%.targz}.zsync" \
              "$f"
          done
          # Versioned zsync copies
          for f in artifacts/**/*-latest-stable.zsync; do
            cp "$f" "${f/latest-stable/$TAG}"
          done

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Extract tag annotation
        run: |
          git fetch --tags --force 2>/dev/null || true
          DELIM=$(openssl rand -hex 8)
          {
            echo "TAG_NOTES<<$DELIM"
            git for-each-ref "refs/tags/$RELEASE_TAG" --format='%(contents)' 2>/dev/null || true
            echo "$DELIM"
          } >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "koreader-tategumi ${{ env.RELEASE_TAG }}"
          body: |
            ${{ env.TAG_NOTES }}


            ## Downloads

            | Platform | Package |
            |----------|---------|
            | Kindle (HF, Touch and newer) | [koreader-kindlehf-${{ env.RELEASE_TAG }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-kindlehf-${{ env.RELEASE_TAG }}.zip) |
            | Kindle (PW2 / non-HF) | [koreader-kindlepw2-${{ env.RELEASE_TAG }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-kindlepw2-${{ env.RELEASE_TAG }}.zip) |
            | Kindle (legacy non-touch) | [koreader-kindle-legacy-${{ env.RELEASE_TAG }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-kindle-legacy-${{ env.RELEASE_TAG }}.zip) |
            | Kobo | [koreader-kobo-${{ env.RELEASE_TAG }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-kobo-${{ env.RELEASE_TAG }}.zip) |
            | PocketBook | [koreader-pocketbook-${{ env.RELEASE_TAG }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-pocketbook-${{ env.RELEASE_TAG }}.zip) |
            | Cervantes | [koreader-cervantes-${{ env.RELEASE_TAG }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-cervantes-${{ env.RELEASE_TAG }}.zip) |
            | reMarkable (armhf) | [koreader-remarkable-${{ env.RELEASE_TAG }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-remarkable-${{ env.RELEASE_TAG }}.zip) |
            | reMarkable (aarch64) | [koreader-remarkable-aarch64-${{ env.RELEASE_TAG }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-remarkable-aarch64-${{ env.RELEASE_TAG }}.zip) |
            | Android (ARM) | [koreader-android-${{ env.RELEASE_TAG }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-android-${{ env.RELEASE_TAG }}.apk) |
            | Android (ARM64) | [koreader-android-arm64-${{ env.RELEASE_TAG }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-android-arm64-${{ env.RELEASE_TAG }}.apk) |
            | macOS (Apple Silicon) | [koreader-macos-arm64-${{ env.RELEASE_TAG }}.7z](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-macos-arm64-${{ env.RELEASE_TAG }}.7z) |
            | macOS (Intel) | [koreader-macos-x86_64-${{ env.RELEASE_TAG }}.7z](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-macos-x86_64-${{ env.RELEASE_TAG }}.7z) |
            | Windows (x86_64) | [koreader-win32-${{ env.RELEASE_TAG }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-win32-${{ env.RELEASE_TAG }}.zip) |
          files: artifacts/**/*
          draft: false
          prerelease: false
