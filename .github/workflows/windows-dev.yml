name: Windows Dev Build

# Standalone MinGW TARGET=win32 iteration path. Release builds also ship
# win32 via .github/workflows/release.yml; keep this for quick redispatch.

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  # Include keep-going (`k`) so one thirdparty failure does not hide siblings.
  # base/Makefile.defs maps make -k → ninja -k0.
  MAKEFLAGS: "k PARALLEL_JOBS=3 OUTPUT_DIR=build"

jobs:
  win32:
    name: Windows (x86_64 MinGW)
    runs-on: ubuntu-latest
    container:
      image: koreader/koappimage:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: win32
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Show revisions
        run: |
          echo "=== Top-level ==="
          git rev-parse HEAD
          git log -1 --oneline
          echo
          echo "=== base gitlink ==="
          git ls-tree HEAD base
          git -C base log -1 --oneline || true

      - name: Install MinGW toolchain
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            p7zip-full
          # FreeType meson needs this once host_machine.system=windows.
          command -v x86_64-w64-mingw32-windres
          # Default Ubuntu MinGW is win32-threaded and lacks std::mutex
          # (tesseract object_cache.h). Prefer the POSIX-threaded compilers.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix
          x86_64-w64-mingw32-g++ -v 2>&1 | grep -i 'Thread model'

      - name: Fetch submodules
        run: make fetchthirdparty

      - name: Build
        id: build
        run: |
          set +e
          set -o pipefail
          make -k TARGET=win32 2>&1 | tee build-win32.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Failure summary
        if: failure() && steps.build.outcome == 'failure'
        run: |
          set -eux
          log=build-win32.log
          if [[ ! -f "$log" ]]; then
            echo "No build-win32.log; nothing to summarize."
            exit 0
          fi

          {
            echo '======== Failed packages ========'
            grep 'FAILED: \[code=' "$log" \
              | sed -n 's/.*thirdparty\/\([^/]*\)\/stamp.*/\1/p; s/.*cmake\/koreader.*/koreader/p' \
              | sort -u \
              || true
            echo
            echo '======== FAILED: lines ========'
            grep 'FAILED: \[code=' "$log" | sort -u || true
            echo
            echo '======== ninja: error ========'
            grep 'ninja: error:' "$log" | sort -u || true
            echo
            echo '======== Compiler / linker errors ========'
            grep -E 'error: |undefined reference|fatal error:|collect2:' "$log" \
              | grep -Ev 'fz_warn|Wformat|format string|unknown conversion|pcls\[' \
              | head -n 200 \
              || true
          } | tee failure-summary.txt

          echo
          echo 'Full log: build-win32.log (uploaded as artifact).'

      - name: Upload build log
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: win32-build-log
          path: |
            build-win32.log
            failure-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Package
        run: make TARGET=win32 update

      - name: Find zip
        id: zip
        run: |
          set -eux
          shopt -s nullglob
          files=(koreader-win32-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "ERROR: no win32 zip package found"
            ls -la
            exit 1
          fi
          echo "Using: ${files[0]}"
          cp "${files[0]}" koreader-win32-dev.zip
          ls -lh koreader-win32-dev.zip
          echo "path=koreader-win32-dev.zip" >> "$GITHUB_OUTPUT"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: koreader-win32-dev
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 14
