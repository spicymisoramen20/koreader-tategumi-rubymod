name: Android Dev Build

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  android-arm64:
    name: Android (ARM64 Dev)
    runs-on: ubuntu-latest

    container:
      image: koreader/koandroid:latest

    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
      ANDROID_ARCH: arm64
      RELEASE_TAG: dev

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch submodules
        run: make fetchthirdparty

      - name: Verify custom base
        run: |
          echo "=== base remote ==="
          git -C base remote -v

          echo "=== base commit ==="
          git -C base rev-parse HEAD

          echo "=== crengine commit ==="
          git -C base/thirdparty/kpvcrlib/crengine rev-parse HEAD

      - name: Build
        run: make TARGET=android ANDROID_ARCH=arm64

      - name: Package
        run: make TARGET=android ANDROID_ARCH=arm64 update

      - name: Create dev keystore
        run: |
          keytool \
            -genkeypair \
            -keystore /tmp/dev.keystore \
            -storepass android \
            -keypass android \
            -alias koreader-dev \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KOReader Dev,O=Development,C=US"

      - name: Sign APK
        run: |
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)

          "${APKSIGNER}" sign \
            --ks /tmp/dev.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias koreader-dev \
            koreader-android-arm64-*.apk

      - name: Verify APK
        run: |
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)

          "${APKSIGNER}" verify \
            --verbose \
            --print-certs \
            koreader-android-arm64-*.apk

      - name: Rename for download
        run: |
          cp koreader-android-arm64-*.apk koreader-android-arm64-dev.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-dev
          path: koreader-android-arm64-dev.apk
          if-no-files-found: error
