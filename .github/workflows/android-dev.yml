name: Android Dev Build

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  MAKEFLAGS: "PARALLEL_JOBS=3 OUTPUT_DIR=build"

concurrency:
  group: android-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Generate build version
    runs-on: ubuntu-latest

    outputs:
      build_version: ${{ steps.version.outputs.build_version }}

    steps:
      - name: Generate unique build version
        id: version
        run: |
          VERSION="v$(date -u +%Y.%m.%d)-dev-${{ github.run_number }}"
          echo "build_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION"

  android-arm64:
    name: Android ARM64 Dev
    needs: version

    runs-on: ubuntu-latest

    container:
      image: koreader/koandroid:latest

    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
      ANDROID_ARCH: arm64
      RELEASE_TAG: ${{ needs.version.outputs.build_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show build version
        run: |
          echo "RELEASE_TAG=$RELEASE_TAG"

      - name: Fetch submodules
        run: |
          make fetchthirdparty

      - name: Verify custom base
        run: |
          echo "=== koreader-base remote ==="
          git -C base remote -v

          echo
          echo "=== koreader-base commit ==="
          git -C base rev-parse HEAD

          echo
          echo "=== CREngine commit ==="
          git -C base/thirdparty/kpvcrlib/crengine rev-parse HEAD

      - name: Build
        run: |
          make TARGET=android ANDROID_ARCH=arm64

      - name: Package
        run: |
          make TARGET=android ANDROID_ARCH=arm64 update

      - name: Find generated APK
        id: apk
        run: |
          echo "=== Generated APKs ==="
          find . -maxdepth 2 -type f -name "koreader-android-arm64-*.apk" -print

          APK=$(find . \
            -maxdepth 2 \
            -type f \
            -name "koreader-android-arm64-*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: ARM64 APK was not generated."
            exit 1
          fi

          echo "Using APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Create development signing key
        run: |
          keytool \
            -genkeypair \
            -v \
            -keystore /tmp/koreader-dev.keystore \
            -storepass android \
            -keypass android \
            -alias koreader-dev \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KOReader Dev,O=Development,C=US"

      - name: Find apksigner
        id: signer
        run: |
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" \
            -type f \
            -name apksigner \
            -print | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"
          echo "path=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        run: |
          APK="${{ steps.apk.outputs.path }}"
          APKSIGNER="${{ steps.signer.outputs.path }}"

          "$APKSIGNER" sign \
            --ks /tmp/koreader-dev.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias koreader-dev \
            "$APK"

      - name: Verify signed APK
        run: |
          APK="${{ steps.apk.outputs.path }}"
          APKSIGNER="${{ steps.signer.outputs.path }}"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Show final APK
        run: |
          APK="${{ steps.apk.outputs.path }}"

          echo "========================================"
          echo "Final APK"
          echo "========================================"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: koreader-android-arm64-${{ needs.version.outputs.build_version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
