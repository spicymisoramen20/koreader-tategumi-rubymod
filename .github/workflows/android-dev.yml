name: Android Dev Build

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  MAKEFLAGS: "PARALLEL_JOBS=3 OUTPUT_DIR=build"

concurrency:
  group: android-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:

  version:
    name: Generate build version
    runs-on: ubuntu-latest

    outputs:
      build_version: ${{ steps.version.outputs.build_version }}

    steps:
      - name: Generate unique build version
        id: version
        run: |
          VERSION="v$(date -u +%Y.%m.%d)-rubymod-${{ github.run_number }}"
          echo "build_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION"

  android-arm64:
    name: Android ARM64 RubyMod
    needs: version

    runs-on: ubuntu-latest

    container:
      image: koreader/koandroid:latest

    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
      ANDROID_ARCH: arm64
      RELEASE_TAG: ${{ needs.version.outputs.build_version }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show build version
        run: |
          echo "RELEASE_TAG=$RELEASE_TAG"

      - name: Fetch submodules
        run: |
          make fetchthirdparty

      # Temporary development override.
      #
      # The top-level tategumi repository still pins an older base gitlink.
      # For now we explicitly move base to the current master of
      # koreader-base-rubymod so that the Android FFI repair is tested.
      #
      # Once the build boots correctly, update the actual submodule pointer
      # and remove this step.
      - name: Use latest RubyMod base
        run: |
          echo "========================================"
          echo "Base before override"
          echo "========================================"

          git -C base remote -v
          git -C base rev-parse HEAD
          git -C base log -1 --oneline

          echo
          echo "Fetching RubyMod base master..."

          git -C base fetch origin master
          git -C base checkout origin/master

          echo
          echo "========================================"
          echo "BASE ACTUALLY BEING BUILT"
          echo "========================================"

          git -C base remote -v
          git -C base rev-parse HEAD
          git -C base log -1 --oneline

          echo
          echo "Checking Android ARM64 POSIX definitions..."

          grep -n "typedef uint64_t dev_t" \
            base/ffi-cdecl/posix_h_android_arm64.lua

          grep -n "typedef uint32_t gid_t" \
            base/ffi-cdecl/posix_h_android_arm64.lua

          grep -n "typedef unsigned long ino_t" \
            base/ffi-cdecl/posix_h_android_arm64.lua

          grep -n "typedef uint32_t nlink_t" \
            base/ffi-cdecl/posix_h_android_arm64.lua

      - name: Build
        run: |
          make TARGET=android ANDROID_ARCH=arm64

      - name: Package
        run: |
          make TARGET=android ANDROID_ARCH=arm64 update

      - name: Find generated APK
        id: apk
        run: |
          echo "========================================"
          echo "Generated APKs"
          echo "========================================"

          find . \
            -maxdepth 2 \
            -type f \
            -name "koreader-android-arm64-*.apk" \
            -print

          APK=$(find . \
            -maxdepth 2 \
            -type f \
            -name "koreader-android-arm64-*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: ARM64 APK was not generated."
            exit 1
          fi

          echo
          echo "Using APK:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Create development signing key
        run: |
          keytool \
            -genkeypair \
            -v \
            -keystore /tmp/koreader-dev.keystore \
            -storepass android \
            -keypass android \
            -alias koreader-dev \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KOReader RubyMod Dev,O=Development,C=US"

      - name: Find apksigner
        id: signer
        run: |
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" \
            -type f \
            -name apksigner \
            -print | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"

          echo "path=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        run: |
          APK="${{ steps.apk.outputs.path }}"
          APKSIGNER="${{ steps.signer.outputs.path }}"

          "$APKSIGNER" sign \
            --ks /tmp/koreader-dev.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias koreader-dev \
            "$APK"

      - name: Verify signed APK
        run: |
          APK="${{ steps.apk.outputs.path }}"
          APKSIGNER="${{ steps.signer.outputs.path }}"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: koreader-android-arm64-${{ needs.version.outputs.build_version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
