name: Android Dev Build

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  MAKEFLAGS: "PARALLEL_JOBS=3 OUTPUT_DIR=build"

jobs:
  android-arm64:
    name: Android Dev (ARM64)
    runs-on: ubuntu-latest

    container:
      image: koreader/koandroid:latest

    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
      ANDROID_ARCH: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Android toolchain
        run: |
          echo "USER=$(whoami)"
          echo "HOME=$HOME"
          echo "PATH=$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          which aarch64-linux-android21-clang || true
          which aarch64-linux-android21-clang++ || true

      - name: Fetch submodules
        run: make fetchthirdparty

      - name: Show checked out base
        run: |
          git -C base remote -v
          git -C base rev-parse HEAD

      - name: Build
        run: make TARGET=android ANDROID_ARCH=arm64

      - name: Package
        run: make TARGET=android ANDROID_ARCH=arm64 update

      - name: Find APK
        run: |
          find . -maxdepth 2 -type f -name "*.apk" -print

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: koreader-android-arm64-dev
          path: koreader-android-arm64-*.apk
          if-no-files-found: error
